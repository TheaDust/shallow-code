<text x="382" y="476" class="body" text-anchor="start">实现业务 · 开发测试 · 有界修复</text>
<text x="382" y="502" class="small" text-anchor="start">独立 Worker 进程</text>
</g>
<g id="verifier" data-node="true"><rect x="756" y="418" width="412" height="126" rx="2" fill="#e8eff7" stroke="#527ba4" stroke-width="1.2"/>
<text x="774" y="448" class="node-title" text-anchor="start">Verifier Agent</text>
<text x="774" y="476" class="body" text-anchor="start">源码定位 · 编写并执行检查程序</text>
<text x="774" y="502" class="small" text-anchor="start">独立会话，按结果子句验收</text>
</g>
