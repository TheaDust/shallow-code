<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" lang="zh-CN" aria-labelledby="title description">
  <title id="title">Verifier 独立验收流程</title>
  <desc id="description">CheckJob 固定快照、需求、初态与执行绑定。Verifier 探索源码索引和应用，通过 check_program 保存合同、检查程序和子句映射，在独立准备的干净环境执行，并按真实宿主收据逐子句判定。可选的独立语义复核只读取需求、程序与执行证据。业务失败在全新环境中复现后才记为 fail；全部结果子句通过才授予 verified。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#56616b"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#43816a"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b5664e"/></marker>
  </defs>
  <style>
    text { font-family: Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #242c33; }
    .title { font-size: 27px; font-weight: 700; }
    .kicker { font-size: 13px; letter-spacing: 1.6px; fill: #6b7580; }
    .node-title { font-size: 20px; font-weight: 700; }
    .body { font-size: 17px; }
    .small { font-size: 15.5px; fill: #4f5962; }
    .label { font-size: 15px; fill: #4f5962; }
    .section { font-size: 17px; font-weight: 700; }
    .mono { font-family: Consolas, 'Liberation Mono', monospace; font-size: 15.5px; }
    .edge { fill: none; stroke: #56616b; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: square; marker-end: url(#arrow); }
    .optional { stroke-dasharray: 5 4; }
    .green { fill: #326c54; }
    .red { fill: #a6533d; }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="899" fill="#ffffff" stroke="#dce1e5"/>

<text x="32" y="43" class="title" text-anchor="start">Verifier 独立验收流程</text>
<text x="1168" y="41" class="kicker" text-anchor="end">03 / VERIFICATION</text>
<line x1="32" y1="64" x2="1168" y2="64" stroke="#aeb6bd" stroke-width="1"/>
<rect x="32" y="85" width="12" height="12" fill="#e8eff7" stroke="#527ba4" stroke-width="1.2"/>
<text x="53" y="97" class="small" text-anchor="start">模型工作</text>
<rect x="218" y="85" width="12" height="12" fill="#f3f4f2" stroke="#6c757b" stroke-width="1.2"/>
<text x="239" y="97" class="small" text-anchor="start">程序步骤</text>
<rect x="404" y="85" width="12" height="12" fill="#f8f2df" stroke="#a18a48" stroke-width="1.2"/>
<text x="425" y="97" class="small" text-anchor="start">应用与产物</text>
<rect x="610" y="85" width="12" height="12" fill="#e8f2ec" stroke="#43816a" stroke-width="1.2"/>
<text x="631" y="97" class="small" text-anchor="start">检查点 / 交付</text>
<rect x="834" y="85" width="12" height="12" fill="#f8eae5" stroke="#b5664e" stroke-width="1.2"/>
<text x="855" y="97" class="small" text-anchor="start">失败 / 恢复</text>
<line x1="1034" y1="91" x2="1072" y2="91" stroke="#56616b" stroke-width="1" stroke-dasharray="5 4"/>
<text x="1081" y="97" class="small" text-anchor="start">可选路径</text>
<g id="check-job" data-node="true"><rect x="32" y="126" width="1136" height="80" rx="2" fill="#ffffff" stroke="#8b949c" stroke-width="1.2"/>
<text x="50" y="156" class="node-title" text-anchor="start">CheckJob · 固定任务输入</text>
<text x="50" y="184" class="body" text-anchor="start">封存快照 · 需求原文 · 唯一初态 · 执行绑定 · moduleEpoch</text>
</g>
<path d="M 196 206 V 264" class="edge"/>
<g id="explore" data-node="true"><rect x="32" y="264" width="328" height="120" rx="2" fill="#e8eff7" stroke="#527ba4" stroke-width="1.2"/>
<text x="50" y="294" class="node-title" text-anchor="start">① 探索与定位</text>
<text x="50" y="322" class="mono" text-anchor="start">source_tree / source_search</text>
<text x="50" y="348" class="small" text-anchor="start">source_read · 按需观察应用</text>
</g>
<g id="program" data-node="true"><rect x="436" y="264" width="328" height="120" rx="2" fill="#e8eff7" stroke="#527ba4" stroke-width="1.2"/>
<text x="454" y="294" class="node-title" text-anchor="start">② check_program</text>
<text x="454" y="322" class="body" text-anchor="start">保存合同、程序与子句映射</text>
<text x="454" y="348" class="small" text-anchor="start">每项预期对应需求原文</text>
</g>
<g id="execute" data-node="true"><rect x="840" y="264" width="328" height="120" rx="2" fill="#f3f4f2" stroke="#6c757b" stroke-width="1.2"/>
<text x="858" y="294" class="node-title" text-anchor="start">③ 独立执行</text>
<text x="858" y="322" class="body" text-anchor="start">QuickJS → 受控 Playwright</text>
<text x="858" y="348" class="small" text-anchor="start">准备并断言 GIVEN，执行场景</text>
</g>
<path d="M 360 324 H 436" class="edge"/>
<text x="398" y="309" class="label" text-anchor="middle">程序</text>
<path d="M 764 324 H 840" class="edge"/>
<text x="802" y="309" class="label" text-anchor="middle">执行</text>
<path d="M 1004 384 V 462" class="edge"/>
<text x="1020" y="432" class="label" text-anchor="start">宿主收据</text>
<g id="review" data-node="true"><rect x="32" y="462" width="328" height="110" rx="2" fill="#e8eff7" stroke="#527ba4" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="50" y="492" class="node-title" text-anchor="start">独立语义复核 · 可选</text>
<text x="50" y="520" class="small" text-anchor="start">需求 + 程序 + 执行证据</text>
<text x="50" y="546" class="small" text-anchor="start">与源码、Builder 会话隔离</text>
</g>
<g id="evaluate" data-node="true"><rect x="436" y="462" width="328" height="110" rx="2" fill="#f3f4f2" stroke="#6c757b" stroke-width="1.2"/>
<text x="454" y="492" class="node-title" text-anchor="start">⑤ 证据校验与判定</text>
<text x="454" y="520" class="body" text-anchor="start">原文结果子句 ↔ 真实执行收据</text>
<text x="454" y="546" class="small" text-anchor="start">逐子句记录结论与证据引用</text>
</g>
<g id="receipts" data-node="true"><rect x="840" y="462" width="328" height="110" rx="2" fill="#f8f2df" stroke="#a18a48" stroke-width="1.2"/>
<text x="858" y="492" class="node-title" text-anchor="start">④ 逐子句证据</text>
<text x="858" y="520" class="small" text-anchor="start">观察 · 动作 checkpoint · 断言</text>
<text x="858" y="546" class="small" text-anchor="start">固定任务、快照与环境身份</text>
</g>
<path d="M 840 518 H 764" class="edge"/>
<path d="M 924 462 V 418 H 196 V 462" class="edge optional"/>
<text x="554" y="410" class="label" text-anchor="middle">同组新程序可批量复核</text>
<path d="M 360 518 H 436" class="edge optional"/>
<text x="398" y="503" class="label" text-anchor="middle">复核</text>
<path d="M 524 572 V 684" class="edge" style="stroke: #43816a; marker-end: url(#arrow-green)"/>
<text x="540" y="652" class="label" text-anchor="start">通过 / 受阻 / 不确定</text>
<path d="M 680 572 V 614 H 1004 V 684" class="edge" style="stroke: #b5664e; marker-end: url(#arrow-red)"/>
<text x="828" y="604" class="label" text-anchor="middle">业务失败</text>
<g id="confirm" data-node="true"><rect x="840" y="684" width="328" height="110" rx="2" fill="#f8eae5" stroke="#b5664e" stroke-width="1.2"/>
<text x="858" y="714" class="node-title" text-anchor="start">业务失败独立复现</text>
<text x="858" y="742" class="small" text-anchor="start">全新应用 / 数据 / 浏览器</text>
<text x="858" y="768" class="small" text-anchor="start">复现后 fail；否则 inconclusive</text>
</g>
<path d="M 840 740 H 764" class="edge" style="stroke: #b5664e; marker-end: url(#arrow-red)"/>
<text x="802" y="725" class="label" text-anchor="middle">确认结果</text>
<g id="report" data-node="true"><rect x="436" y="684" width="328" height="110" rx="2" fill="#e8f2ec" stroke="#43816a" stroke-width="1.2"/>
<text x="454" y="714" class="node-title" text-anchor="start">⑥ 场景检查报告</text>
<text x="454" y="742" class="small" text-anchor="start">pass · fail · blocked · inconclusive</text>
<text x="454" y="768" class="small" text-anchor="start">全部结果子句 pass → verified</text>
</g>
<line x1="32" y1="684" x2="32" y2="767" stroke="#527ba4" stroke-width="2"/>
<text x="48" y="704" class="section" text-anchor="start">历史程序重放 · 可选</text>
<text x="48" y="732" class="small" text-anchor="start">模块 / 修复 / 最终阶段</text>
<text x="48" y="758" class="small" text-anchor="start">兼容程序直接执行，跳过探索</text>
<line x1="32" y1="834" x2="1168" y2="834" stroke="#d8dde1" stroke-width="1"/>
<text x="32" y="863" class="small" text-anchor="start">默认关闭独立语义复核与历史程序重放；验收依据始终是所标注快照的真实执行收据。</text>
</svg>
