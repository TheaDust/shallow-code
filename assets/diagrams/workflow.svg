<text x="630" y="502" class="label" text-anchor="start">后台</text>
<g id="verify-a" data-node="true"><rect x="198" y="520" width="216" height="66" rx="2" fill="#e8eff7" stroke="#527ba4" stroke-width="1.2"/>
<text x="216" y="550" class="node-title" text-anchor="start">检查 S1</text>
<text x="216" y="578" class="small" text-anchor="start">独立环境</text>
</g>
