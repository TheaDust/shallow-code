<text x="468" y="812" class="small" text-anchor="start">默认汇总各功能组原快照证据</text>
<g id="delivery" data-node="true"><rect x="864" y="738" width="272" height="110" rx="2" fill="#e8f2ec" stroke="#43816a" stroke-width="1.2"/>
