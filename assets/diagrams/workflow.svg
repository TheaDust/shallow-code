<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" lang="zh-CN" aria-labelledby="title description">
  <title id="title">实现与验收的流水线</title>
  <desc id="description">需求解析和功能分组之后，Builder 在同一模块中逐个实现功能组。控制器每完成一组即封存独立快照并提交后台 Verifier，Builder 继续下一组。模块边界等待检查汇合并检查当前版本运行就绪，默认汇总各组原快照证据。全部模块结束后检查最终交付合同并输出应用、补丁与报告。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#56616b"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#43816a"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b5664e"/></marker>
  </defs>
  <style>
    text { font-family: Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #242c33; }
    .title { font-size: 27px; font-weight: 700; }
    .kicker { font-size: 13px; letter-spacing: 1.6px; fill: #6b7580; }
    .node-title { font-size: 20px; font-weight: 700; }
    .body { font-size: 17px; }
    .small { font-size: 15.5px; fill: #4f5962; }
    .label { font-size: 15px; fill: #4f5962; }
    .section { font-size: 17px; font-weight: 700; }
    .mono { font-family: Consolas, 'Liberation Mono', monospace; font-size: 15.5px; }
    .edge { fill: none; stroke: #56616b; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: square; marker-end: url(#arrow); }
    .optional { stroke-dasharray: 5 4; }
    .green { fill: #326c54; }
    .red { fill: #a6533d; }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="899" fill="#ffffff" stroke="#dce1e5"/>

<text x="32" y="43" class="title" text-anchor="start">实现与验收的流水线</text>
<text x="1168" y="41" class="kicker" text-anchor="end">01 / WORKFLOW</text>
<line x1="32" y1="64" x2="1168" y2="64" stroke="#aeb6bd" stroke-width="1"/>
<rect x="32" y="85" width="12" height="12" fill="#e8eff7" stroke="#527ba4" stroke-width="1.2"/>
