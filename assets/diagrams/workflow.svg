<text x="50" y="566" class="section" text-anchor="start">Verifier</text>
<g id="build-a" data-node="true"><rect x="198" y="286" width="216" height="68" rx="2" fill="#e8eff7" stroke="#527ba4" stroke-width="1.2"/>
<text x="216" y="316" class="node-title" text-anchor="start">功能组 A</text>
<text x="216" y="344" class="small" text-anchor="start">实现与自测</text>
</g>
<g id="build-b" data-node="true"><rect x="506" y="286" width="216" height="68" rx="2" fill="#e8eff7" stroke="#527ba4" stroke-width="1.2"/>
